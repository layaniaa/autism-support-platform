version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autism-support-app
    restart: unless-stopped
    working_dir: /app
    environment:
      - DB_HOST=db
      - DB_DATABASE=autism
      - DB_USERNAME=autism_user
      - DB_PASSWORD=autism_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./:/app
      - ./storage:/app/storage
      - ./bootstrap/cache:/app/bootstrap/cache
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      - db
      - redis
    networks:
      - autism-network

  nginx:
    image: nginx:alpine
    container_name: autism-support-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/app
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - autism-network

  db:
    image: mysql:8.0
    container_name: autism-support-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-autism}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-autism_password}
      MYSQL_PASSWORD: ${DB_PASSWORD:-autism_password}
      MYSQL_USER: ${DB_USERNAME:-autism_user}
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - autism-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: autism-support-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - autism-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: autism-support-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - autism-network

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local

networks:
  autism-network:
    driver: bridge